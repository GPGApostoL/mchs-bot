<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070807">
<title>ЛЧС — Квалификационное тестирование</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--lime:#b7ff00;--bg:#070807;--panel:#101210;--panel2:#151715;--border:#282b28;--muted:#878c85;--text:#f4f5f2}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.app{min-height:100vh;max-width:760px;margin:auto;padding:max(20px,env(safe-area-inset-top)) 20px max(26px,env(safe-area-inset-bottom));position:relative;overflow:hidden}.glow{position:absolute;border-radius:999px;filter:blur(75px);background:var(--lime);opacity:.13;pointer-events:none}.g1{width:250px;height:250px;right:-130px;top:70px}.g2{width:180px;height:180px;left:-120px;bottom:80px;opacity:.06}.brand{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}.mark{width:42px;height:42px;border:1px solid var(--lime);color:var(--lime);display:grid;place-items:center;font-size:12px;font-weight:900}.caption{font-size:9px;letter-spacing:.18em;color:#656a63;font-weight:900}.hero{position:relative;z-index:1;margin-top:clamp(65px,14vh,140px)}.eyebrow{display:flex;gap:7px;align-items:center;color:var(--lime);font-size:10px;letter-spacing:.15em;font-weight:900}.hero h1{font-size:clamp(56px,16vw,105px);line-height:.84;letter-spacing:-.07em;margin:18px 0 26px}.hero h1 span{color:var(--lime)}.hero p{max-width:560px;color:#969b94;line-height:1.55;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:38px 0 22px}.stats>div{padding:16px 8px;border-right:1px solid var(--border)}.stats>div:last-child{border-right:0}.stats b{font-size:25px;display:block}.stats span{font-size:9px;color:#646961;text-transform:uppercase;letter-spacing:.1em;font-weight:900}.primary{width:100%;height:56px;border:1px solid var(--lime);background:var(--lime);color:#0a0c09;font-weight:900;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer}.primary:disabled{opacity:.55}.hello{text-align:center;color:#5f645e;font-size:11px!important;margin:12px 0!important}.footer{position:relative;z-index:1;margin-top:65px;color:#51564f;font-size:9px;text-transform:uppercase;letter-spacing:.08em;line-height:1.5}.quiz{padding-top:max(14px,env(safe-area-inset-top))}.qhead{display:grid;grid-template-columns:42px 1fr 42px;gap:10px;align-items:center}.icon,.score{width:42px;height:42px;border:1px solid var(--border);background:transparent;color:#c4c8c1;display:grid;place-items:center}.score{color:var(--lime);font-weight:900;font-size:12px}.qmeta{text-align:center}.qmeta small{display:block;color:#656a63;font-size:9px;font-weight:900;letter-spacing:.15em}.qmeta b{display:block;margin-top:2px;font-size:14px}.track{height:3px;background:#1a1d1a;margin:18px 0 42px}.fill{height:100%;background:var(--lime);transition:width .3s}.tag{display:flex;align-items:center;gap:7px;color:var(--lime);font-size:10px;letter-spacing:.15em;font-weight:900}.question{font-size:clamp(24px,6vw,42px);line-height:1.08;letter-spacing:-.035em;margin:14px 0 26px}.note{border-left:2px solid #60651f;background:#0e100d;color:#777d70;padding:8px 12px;font-size:11px;line-height:1.45;margin:-7px 0 18px}.answers{display:grid;gap:10px}.ans{width:100%;min-height:70px;display:grid;grid-template-columns:34px 1fr 26px;gap:12px;align-items:center;text-align:left;padding:12px 14px;background:var(--panel);border:1px solid var(--border);color:#e8eae6;cursor:pointer}.ans:hover{background:var(--panel2);border-color:#535950}.ans.selected,.ans.correct{border-color:var(--lime);background:#141a0d}.ans.wrong{border-color:#8b3636;background:#1a0f0f}.letter{width:29px;height:29px;border:1px solid #3a3e39;display:grid;place-items:center;font-size:11px;font-weight:900;color:#8d938b}.selected .letter,.correct .letter{border-color:var(--lime);color:var(--lime)}.wrong .letter{border-color:#8b3636;color:#ff8d8d}.text{font-size:14px;line-height:1.42;overflow-wrap:anywhere}.mark{color:#4f554d;text-align:right}.correct .mark{color:var(--lime)}.wrong .mark{color:#ff8d8d}.feedback{margin-top:15px;padding:12px 13px;border:1px solid var(--border);font-size:12px;line-height:1.4}.good{color:var(--lime);background:#0e1309}.bad{color:#ff9b9b;background:#160d0d}.error{margin-top:14px;padding:11px 13px;background:#180c0c;border:1px solid #5e2b2b;color:#ff9b9b;font-size:12px}.result{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;z-index:1}.big{font-size:clamp(96px,29vw,180px);line-height:.8;letter-spacing:-.09em;color:var(--lime);font-weight:900;margin:28px 0 17px}.big span{font-size:.35em}.result h1{font-size:30px;letter-spacing:-.04em;margin:0}.muted{color:#777d75;font-size:13px}.resultcard{width:100%;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:18px 0 22px}.resultcard>div{padding:16px 5px;border-right:1px solid var(--border)}.resultcard>div:last-child{border:0}.resultcard span{display:block;color:#62675f;font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:900}.resultcard b{display:block;font-size:23px;margin-top:5px}.ghost{width:100%;border:0;background:transparent;color:#858b83;padding:14px;cursor:pointer}@media(min-width:700px){.app{padding-left:34px;padding-right:34px}.ans{min-height:78px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp; tg&&tg.ready&&tg.ready(); tg&&tg.expand&&tg.expand(); tg&&tg.setHeaderColor&&tg.setHeaderColor('#070807'); tg&&tg.setBackgroundColor&&tg.setBackgroundColor('#070807');
const root=document.getElementById('root');let state={screen:'home',session:null,q:null,index:0,total:50,score:0,answer:null,busy:false,error:null};
const icon={arrow:'→',back:'←',check:'✓',x:'×',next:'›',spark:'✦'};
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){
 if(state.screen==='home')return home(); if(state.screen==='result')return result(); return quiz();
}
function home(){root.innerHTML=`<main class="app"><div class="glow g1"></div><div class="glow g2"></div><div class="brand"><div class="mark">ЛЧС</div><div class="caption">QUALIFICATION / TEST</div></div><section class="hero"><div class="eyebrow">${icon.spark} МИНИ-ПРИЛОЖЕНИЕ</div><h1>Проверь<br><span>знания.</span></h1><p>Интерактивное квалификационное тестирование по материалам исходного документа.</p><div class="stats"><div><b>311</b><span>в базе</span></div><div><b>50</b><span>за тест</span></div><div><b>4</b><span>варианта</span></div></div><button class="primary" onclick="startQuiz()">${state.busy?'Запускаем…':'Начать тест →'}</button><p class="hello">Привет, ${esc((tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||'коллега')}.</p>${state.error?`<div class="error">${esc(state.error)}</div>`:''}</section><div class="footer">Ответ выбирается нажатием на всю карточку — удобно с телефона.</div></main>`}
function quiz(){let q=state.q,pct=Math.max(2,Math.round(state.index/state.total*100));root.innerHTML=`<main class="app quiz"><div class="qhead"><button class="icon" onclick="homeScreen()">${icon.back}</button><div class="qmeta"><small>ТЕСТИРОВАНИЕ</small><b>${String(state.index+1).padStart(2,'0')} / ${state.total}</b></div><div class="score">${state.score}</div></div><div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="tag">${icon.spark} ВОПРОС</div><h1 class="question">${esc(q.question)}</h1>${q.answer_inferred?'<div class="note">Ответ в исходном документе был отмечен как требующий уточнения.</div>':''}<div class="answers">${q.options.map((o,i)=>{let cls='ans';if(state.answer&&state.answer.correct_index===i)cls+=' correct';if(state.selected===i&&!state.answer)cls+=' selected';if(state.answer&&state.selected===i&&!state.answer.correct)cls+=' wrong';let mark=state.answer&&state.answer.correct_index===i?icon.check:(state.answer&&state.selected===i&&!state.answer.correct?icon.x:icon.next);return `<button class="${cls}" onclick="choose(${i})" ${state.busy||state.answer?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span class="text">${esc(o)}</span><span class="mark">${mark}</span></button>`}).join('')}</div>${state.answer&&!state.answer.finished?`<div class="feedback ${state.answer.correct?'good':'bad'}">${state.answer.correct?icon.check:icon.x} ${state.answer.correct?'Правильно':'Неверно. Правильный ответ: '+esc(state.answer.correct_answer)}</div>`:''}${state.error?`<div class="error">${esc(state.error)}</div>`:''}</main>`}
function result(){let score=state.answer&&state.answer.score!=null?state.answer.score:state.score;let pct=state.answer&&state.answer.percent!=null?state.answer.percent:Math.round(score/state.total*100);root.innerHTML=`<main class="app"><div class="glow g1"></div><section class="result"><div class="eyebrow">${icon.spark} РЕЗУЛЬТАТ ТЕСТИРОВАНИЯ</div><div class="big">${pct}<span>%</span></div><h1>${pct>=75?'Тест пройден':'Нужно повторить'}</h1><p class="muted">${score} правильных ответов из ${state.total}</p><div class="resultcard"><div><span>Правильных</span><b>${score}</b></div><div><span>Ошибочных</span><b>${state.total-score}</b></div><div><span>Всего</span><b>${state.total}</b></div></div><button class="primary" onclick="startQuiz()">↻ Пройти ещё раз</button><button class="ghost" onclick="homeScreen()">На главный экран</button></section></main>`}
async function startQuiz(){state.busy=true;state.error=null;render();try{let r=await fetch('/api/quiz/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg&&tg.initData||''})});if(!r.ok)throw Error('Не удалось запустить тест.');let d=await r.json();state={...state,screen:'quiz',session:d.session_id,q:d.question,index:0,total:d.total,score:0,answer:null,selected:null,busy:false,error:null};render()}catch(e){state.busy=false;state.error=e.message||'Ошибка запуска теста.';render()}}
async function choose(index){if(state.busy||state.answer)return;state.selected=index;state.busy=true;state.error=null;render();try{let r=await fetch('/api/quiz/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:state.session,question_index:state.index,option_index:index})});if(!r.ok)throw Error('Не удалось сохранить ответ.');let d=await r.json();state.answer=d;if(d.correct)state.score++;state.busy=false;render();if(d.finished){setTimeout(()=>{state.screen='result';render()},650)}else{setTimeout(()=>{state.q=d.next_question;state.index=d.next_question_index;state.answer=null;state.selected=null;render()},700)}}catch(e){state.busy=false;state.selected=null;state.error=e.message||'Ошибка ответа.';render()}}
function homeScreen(){state={screen:'home',session:null,q:null,index:0,total:50,score:0,answer:null,busy:false,error:null};render()}
render();
</script>
</body>
</html>
